  <!-- Pre-emptive Inline Error Trap to absorb transient network, chunk or extension rejections -->
  <script>
    (function () {
      if (typeof window !== 'undefined') {
        window.addEventListener('unhandledrejection', function (e) {
          var msg = (e && e.reason && (e.reason.message || e.reason)) || '';
          if (
            msg.indexOf('Failed to fetch') !== -1 ||
            msg.indexOf('dynamically imported module') !== -1 ||
            msg.indexOf('Loading chunk') !== -1 ||
            (e.reason && e.reason.name === 'AbortError')
          ) {
            console.warn('[Network Resilience] Handled transient fetch/chunk rejection.');
            e.preventDefault();
          }
        });
      }
    })();
  </script>
